services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: menzil
      POSTGRES_USER: menzil
      POSTGRES_PASSWORD: menzil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
