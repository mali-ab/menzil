services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: menzil
      POSTGRES_USER: menzil
      POSTGRES_PASSWORD: menzil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menzil -d menzil"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./docker/init-migrations.sh:/docker-entrypoint-initdb.d/10-migrations.sh:ro

volumes:
  postgres_data:
